# Pinned build: the host builds from source on every push to the production branch.
# Node is pinned so a stale host default can never break the SSG build.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  # The Web3Forms access key ships in the client bundle by design (public client key).
  # It still lives in a Netlify env var (VITE_WEB3FORMS_KEY), never in the repo.
  SECRETS_SCAN_OMIT_KEYS = "VITE_WEB3FORMS_KEY"

# --- Headers ---------------------------------------------------------------
# Header rules match the REQUEST path, not the served file: every HTML-serving
# path gets its own no-cache rule so no browser holds a stale shell pointing at
# long-gone fingerprinted bundles.

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # 'self', not 'none', since avgust 2026: the Primeri preview overlay on
    # /nastanitve iframes the site's own demo pages (/primeri/*). Same-origin
    # framing only — every third-party origin is still refused, which is the
    # actual clickjacking threat. Netlify concatenates duplicate CSP headers
    # (both would be enforced, strictest wins), so this cannot be overridden
    # per-path; the global value is the one that must carry the allowance.
    Content-Security-Policy = "frame-ancestors 'self'"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/404.html"
  [headers.values]
    Cache-Control = "no-cache"

# The Primeri demo pages (fictional template renders, noindex, iframed by the
# preview overlay). no-cache because their assets are NOT immutable-named:
# photos/ and the page itself refresh under the same names, so no browser may
# hold them for a year the way /img/* is held.
[[headers]]
  for = "/primeri/*"
  [headers.values]
    Cache-Control = "no-cache"

# The nastanitve subpage. BOTH paths: header rules match the REQUEST path, so
# the rule on the .html file does not cover a visit to /nastanitve.
[[headers]]
  for = "/nastanitve"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/nastanitve.html"
  [headers.values]
    Cache-Control = "no-cache"

# Per-lead demo pages under hashed paths (/nastanitve/<hash>/, campaign demos
# copied from the scrape_airbnb build; noindex meta on every page). Same rule
# as /primeri/*: their fonts.css and fonts/ are NOT immutable-named, so no
# browser may hold them the way /assets/* is held.
[[headers]]
  for = "/nastanitve/*"
  [headers.values]
    Cache-Control = "no-cache"

# Same as nastanitve: the rule on the .html file does not cover a visit to
# /zasebnost, so both request paths get an explicit no-cache HTML rule.
[[headers]]
  for = "/zasebnost"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/zasebnost.html"
  [headers.values]
    Cache-Control = "no-cache"

# The two terms documents, same rule: a header on the .html file never covers a
# visit to the extensionless path.
[[headers]]
  for = "/pogoji-splosno"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/pogoji-splosno.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/pogoji-nastanitve"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/pogoji-nastanitve.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The plate loops. Version-stamped filenames (scripts/build-pillar-videos.mjs),
# so the same immutable year applies — a re-encode MUST bump the version or it
# never reaches a repeat visitor.
[[headers]]
  for = "/video/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# --- Redirects -------------------------------------------------------------
# First match wins. Everything unknown is a REAL 404, never a Home bounce.

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
