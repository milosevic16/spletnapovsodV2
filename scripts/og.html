<!DOCTYPE html>
<!-- Source for public/og.jpg — rendered by scripts/build-og.mjs via headless Edge
     so the type is the site's real variable Archivo (wght+wdth), not a substitute.
     The image IS the signature: the composed 45/55 section drawing — the same
     drawing the cut scene rests at. Colors mirror tokens.css by hand. -->
<html lang="sl">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: 'Archivo Variable';
        font-weight: 100 900;
        font-stretch: 62% 125%;
        src: url(../public/fonts/archivo-latin-standard-normal.woff2) format('woff2-variations');
      }
      @font-face {
        font-family: 'Chivo Mono';
        font-weight: 400;
        src: url(../public/fonts/chivo-mono-latin-400-normal.woff2) format('woff2');
      }
      * { margin: 0; box-sizing: border-box; }
      body {
        width: 1200px;
        height: 630px;
        background: #f5f2eb;
        position: relative;
        overflow: hidden;
      }
      /* FACADE — above the cut (45%). */
      .facade {
        position: absolute;
        inset: 0 0 55% 0;
        padding: 52px 64px 0;
      }
      .kicker {
        font-family: 'Archivo Variable', sans-serif;
        font-stretch: 74%;
        font-weight: 500;
        font-size: 20px;
        letter-spacing: 0.13em;
        color: #50555a;
      }
      h1 {
        margin-top: 20px;
        font-family: 'Archivo Variable', sans-serif;
        font-stretch: 115%;
        font-weight: 275;
        font-size: 64px;
        line-height: 1.05;
        letter-spacing: -0.015em;
        color: #1a1c1e;
        max-width: 22ch;
      }
      h1 em {
        font-style: normal;
        color: #b03b22;
      }
      /* THE CUT. */
      .plane {
        position: absolute;
        left: 0;
        right: 0;
        top: 45%;
        height: 4px;
        margin-top: -2px;
        background: #b03b22;
      }
      .plane::before,
      .plane::after {
        content: '';
        position: absolute;
        top: -5px;
        width: 14px;
        height: 14px;
        background: #b03b22;
      }
      .plane::before { left: 0; }
      .plane::after { right: 0; }
      /* SECTION — below the cut (55%): poché with real machine lines. */
      .below {
        position: absolute;
        inset: 45% 0 0 0;
        background: #1a1c1e;
        padding: 44px 64px 0;
      }
      .mlabel {
        font-family: 'Archivo Variable', sans-serif;
        font-stretch: 74%;
        font-weight: 500;
        font-size: 20px;
        letter-spacing: 0.13em;
        color: #c6c9c3;
      }
      .lines {
        margin-top: 26px;
        font-family: 'Chivo Mono', monospace;
        font-size: 23px;
        line-height: 1.75;
        color: #c6c9c3;
      }
      .wordmark {
        position: absolute;
        right: 64px;
        bottom: 40px;
        font-family: 'Archivo Variable', sans-serif;
        font-stretch: 74%;
        font-weight: 600;
        font-size: 26px;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: #f5f2eb;
        padding: 12px 18px;
        border: 1px solid #414a50;
        border-right-width: 5px;
      }
    </style>
  </head>
  <body>
    <div class="facade">
      <div class="kicker">IZDELAVA SPLETNIH STRANI · SLOVENIJA</div>
      <h1><em>Hitre</em>, dostopne in profesionalne spletne strani.</h1>
    </div>
    <div class="plane"></div>
    <div class="below">
      <div class="mlabel">KAR VIDI GOOGLE</div>
      <div class="lines">
        &lt;title&gt;SpletnaPovsod — Izdelava spletnih strani&lt;/title&gt;<br />
        &lt;link rel="canonical" href="https://spletnapovsod.si/"&gt;<br />
        User-agent: ClaudeBot · Allow: /
      </div>
      <div class="wordmark">SpletnaPovsod</div>
    </div>
  </body>
</html>
