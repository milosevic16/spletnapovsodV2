<!DOCTYPE html>
<html lang="sl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- The surface the browser chrome meets. MIRRORS html/body (base.css
         paints them --surface #f5f2eb): iOS samples the painted page and
         ignores this meta, Android reads the meta — the two must agree or the
         two platforms frame the page in different colours. It read #ece8de
         from the era when the opening band carried the deeper beige. -->
    <meta name="theme-color" content="#f5f2eb" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Above-the-fold font subsets. Latin only: the veil word, kicker and h1's
         opening words carry no č/š/ž; the ext subsets swap in behind fontaine's
         metric-matched fallbacks, so the swap changes glyphs, not geometry. -->
    <link rel="preload" href="/fonts/geist-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <title>SpletnaPovsod</title>
    <!-- The opening veil: the logo's origin story. Static HTML + CSS only,
         system fonts only, no images, no JS dependency: a pure-CSS timed
         sequence that CANNOT hang (the timeline runs whether or not the app
         ever boots; the app only removes the spent node — App.vue).

         On the paper ground, »spletnapovsod« types out letter by letter; the
         p of Povsod and the final d are the SEAL'S OWN HALVES — each a
         COMPLETE letter, bowl closed and stem whole, riding its own red disc.
         The plain letters vanish, the d's coin slides onto the p's, and the
         two letterforms INTERLOCK into the exact artwork; the fused seal then
         flies to the hero's brand position while the page renders beneath it,
         landing EXACTLY on the real stamp and crossfading onto it.

         HOW THE LETTERS WERE RECOVERED, since the artwork is one fused
         drawing with no standalone halves in it: its outer contour has two
         CUSPS — (627.46, 486.9) and (626.37, 739.23) — the points where the
         two bowls' outlines meet, and between them the contour belongs wholly
         to one letter. So each letter takes its own share of the REAL contour
         and closes along its OWN bowl circle: the arc the other letter hides
         in the fused drawing, concentric with that letter's counter, running
         through both cusps (r 218.01 for the p, 217.02 for the d — the two
         cusp distances agree to 0.4 of 218, which is what proves the cusps
         really are on that circle). Nothing is invented: re-render the pair
         together and it is the artwork, to 48 pixels in 642,000 at 6× the
         size the mark is ever drawn (the p's bowl passing a hair inside the
         d's counter, ~0.1px where it shows). An earlier pass split the ink
         down the middle instead, and the flat cut edge was visible — the
         letters must be COMPLETED, never partitioned.

         THE LANDING IS A COPIED FORMULA, NOT A MEASUREMENT: left/top/height
         below repeat --hero-inset, --hero-display (tokens.css) and the
         desktop masthead's 45px flow height as literals. The hero's mark now
         stands ALONE above the wordmark lines (StatementSection), so its SVG
         box IS its ink: ink-left = ink-top = the inset exactly, height =
         0.55em of --hero-display. Change any of those and these literals
         change with them — each side names the other.

         TIMELINE (base.css settle delays and App.vue's cleanup are keyed to
         it — change one, change all): type 0.09+i*0.04875s (done 0.675s),
         HOLD 0.7s on the whole word (owner: a beat to read it), then vanish
         AND close together 1.375-1.7125s, SEAT 1.7125s, fly 2.3125-2.7625s,
         ground ROLLS UP 2.35-2.7625s, mark crossfades out 2.7625-2.95s, veil
         hidden 2.95s. The tempo is still the original x0.75; the hold shifts
         everything after the word by +0.3625s and every relative gap
         survives.

         THE DISCS NEVER INTERPENETRATE (owner: no separate rings once they
         touch — just the final logo). The close brings the coins exactly to
         TANGENCY, edge on edge, timed to end with the letters' collapse; at
         that instant one steps() beat does everything at once: the d SEATS to
         the mark's true overlap and the paint-order handoff fires, so the
         very first overlapping frame IS the finished logo. The gradual
         slide-through — two circles visibly passing through each other — no
         longer exists at any frame. The node is removed by
         App.vue ON THE VEIL'S OWN animationend — never by the wall clock,
         which is a different clock and once cut this sequence short in
         production.

         The roll and the flight are deliberately concurrent: the mark travels
         to the header's corner while the ground it was printed on climbs to
         become that same header. The ground wears the HEADER's surface (paper
         + press screen), never the hero's — the hero is what gets revealed
         underneath, so the two must differ. -->
    <style>
      #veil {
        position: fixed;
        inset: 0;
        z-index: 9999;
        pointer-events: none;
        /* No ground of its own any more — the ground is its own layer below,
           so rolling it up cannot clip the mark that is still flying over it. */
        animation: veil-done 0.01s linear 2.95s forwards;
        /* Where the mark lands = the hero brand mark, by shared formula:
           left/top: --hero-inset (+ the desktop masthead's 45px in-flow
           strip); height: 0.55em of --hero-display — the mark stands alone
           above the wordmark lines, so its SVG box top IS its ink top.
           Paired with tokens.css and StatementSection.vue — change there,
           change here. */
        /* PHONES LAND ON THE SHEET'S TOP-LEFT CORNER: there is no header over
           the hero there, only the menu control, so the stamp on the sheet is
           the brand and the frame's corner IS --hero-inset. Desktop overrides
           all three below, where the stamp has crossed to the right. */
        --land-left: clamp(1.25rem, 4.9vw, 4.5rem);
        --land-top: clamp(1.25rem, 4.9vw, 4.5rem);
        --land-h: calc(0.55 * clamp(3rem, 0.25rem + 16vw, 8.25rem));
      }
      /* THE GROUND. It wears the HEADER's surface, not the hero's: paper plus
         the same press screen (.press .press--light, from the bundled CSS,
         which is render-blocking — the same reasoning that lets the veil use
         the real webfont). That is what makes the ending work: the ground does
         not fade away, it ROLLS UP, and on desktop it stops exactly on the
         header's own 45px strip — same colour, same screen, same lattice
         origin (both boxes start at viewport 0,0) — so the thing that was
         covering the page simply becomes the header, and the hero is revealed
         beneath it. On a phone there is no bar at the top, so it rolls all the
         way: a window shade.

         HEIGHT, not transform: a shade's visible part must stay still while
         its bottom edge travels. scaleY would squash the dots and the colour
         band with it. The element is fixed with no children, so the cost is a
         paint on one layer, not a page reflow. */
      #veil .v-ground {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 100%;
        background-color: #f5f2eb;
        animation: v-roll 0.4125s cubic-bezier(0.22, 1, 0.36, 1) 2.35s forwards;
      }
      @media (min-width: 900px) {
        /* 45px = the masthead's in-flow strip, measured. Paired with the
           landing formula below, which carries the same literal. */
        #veil .v-ground {
          animation-name: v-roll-to-header;
        }

        #veil {
          /* THE STAMP STANDS AT THE SHEET'S TOP-RIGHT on desktop, so the mark
             flies across rather than straight down. Its left edge is what this
             has to name: the viewport's own width, less the same inset the
             frame is drawn on, less the mark's width — and the mark's width is
             a property of its artwork, 1.5586 of its height. The
             percentage resolves against #veil, which is fixed to inset:0, i.e.
             the layout viewport with the scrollbar already excluded — the same
             box the sheet's own right inset is measured from. */
          --land-left: calc(100% - clamp(1.25rem, 4.9vw, 4.5rem) - 1.5586 * var(--land-h));
          --land-top: calc(45px + clamp(1.25rem, 4.9vw, 4.5rem));
          --land-h: calc(0.55 * clamp(8.25rem, 4.9rem + 5.93vw, 10.25rem));
        }
      }

      /* SUBPAGES LAND ON THE MASTHEAD'S HOME MARK, top-left, at every width.
         Everything above describes the HOME page, whose hero carries the big
         corner stamp the mark becomes. No other page has that stamp: on
         /nastanitve and the terms/privacy pages the brand lives in the
         masthead instead, so the mark was flying to a hero stamp that does not
         exist — measured on /nastanitve at 1265px, it landed top-RIGHT at
         y≈107 over the hero photograph while the real logo sat at (64, 8).

         The hook is the mark itself rather than a page class: .masthead__home
         is v-if="props.home", so it is in the PRERENDERED html of exactly
         the four subpages and of neither the home page nor 404 — no JS, no
         route list to keep in sync. (Where :has() is unsupported the rule is
         simply skipped and the old home-page landing applies: wrong corner,
         never broken.)

         ONE rule for both widths, because the target is width-invariant: the
         strip is 45px and .masthead__homemark is 1.7rem on phones and desktop
         alike. Left follows the .container's own arithmetic — the row is a
         .container, and the mark is absolutely positioned at its --gutter — so
         this reproduces that centring rather than guessing at it. Verified
         against the live target at 390 and 1265; paired with SiteMasthead.vue
         (.masthead__home / .masthead__homemark) — change there, change here. */
      body:has(.masthead__home) #veil {
        --land-left: calc(
          max(0px, (100% - (var(--container) + 2 * var(--gutter))) / 2) + var(--gutter)
        );
        --land-top: calc((45px - 1.7rem) / 2);
        --land-h: 1.7rem;
      }
      /* The word: one flex row, everything in em so the fly can scale the
         whole assembly by animating font-size alone. Slightly above centre —
         the optical middle of the field. */
      #veil .v-word {
        position: absolute;
        left: 50%;
        top: 42%;
        transform: translate(-50%, -50%);
        display: flex;
        align-items: center;
        height: 1.5em;
        margin: 0;
        /* LOAD-BEARING, and it is what fixed the phone intro. An absolutely
           positioned box at left:50% has only the RIGHT HALF of the viewport
           as its available width. On desktop the word is far narrower than
           that half, so nothing happened; on a phone the natural row (332px at
           375) does not fit in 187px, and the letter slots — flex items with
           the default flex-shrink:1 — were squeezed from 0.62em to 0.35em
           while the two disc SVGs (flex:0 0 auto) kept their size. The glyphs
           then overflowed their own slots by up to 8px and `overflow: hidden`
           cut them: measured, n rendered as r and o as c, exactly as reported.
           max-content takes the row out of that squeeze; slots measure the
           full 0.62em again and every glyph fits with a pixel to spare. */
        width: max-content;
        /* 7.6vw, not 8.8: once the letters stopped being clipped the word
           spanned 88% of a 375 screen, edge to edge. 7.6 lands it at 76% —
           real margins — and changes nothing at 611px and up, where the 2.9rem
           cap has already taken over. */
        font-size: clamp(1.05rem, 7.6vw, 2.9rem);
        /* The brand's own grotesque, safely: the bundled CSS is render-blocking
           (family + fontaine metric fallback exist before ANY first paint) and
           the woff2 is preloaded above — so a late swap changes glyphs, not
           geometry. Geist 500, tight tracking — the design system's sans at
           its emphasis weight. */
        font-family: 'Geist', 'Geist fallback', Arial, sans-serif;
        font-weight: 500;
        letter-spacing: -0.02em;
        line-height: 1;
        color: #242424;
        white-space: nowrap;
        /* fly to the brand corner (translate stays; left/top/font-size land
           it): +1.169em / +0.75em centre the row's BOX on the target (box
           2.458em = margins 0.06·3 + discs 3em − pull 0.7218em; half less the
           p's own leading margin), so
           the untouched -50% translate centres it ON the target box. */
        animation:
          v-fly 0.45s cubic-bezier(0.22, 1, 0.36, 1) 2.3125s forwards,
          v-word-out 0.1875s ease-out 2.7625s forwards;
      }
      /* A typed slot: fixed width so the contraction is animatable. */
      #veil .v-ch {
        display: inline-block;
        width: 0.62em;
        text-align: center;
        opacity: 0;
        overflow: hidden;
        animation:
          v-type 1ms steps(1, end) calc(0.09s + var(--i) * 0.04875s) forwards,
          v-gone 0.3375s cubic-bezier(0.22, 1, 0.36, 1) 1.375s forwards;
      }
      /* The two logo letters: red disc, white letterform. The d is the p
         turned 180° — the mark's point symmetry. */
      #veil .v-pd {
        height: 1.5em;
        width: 1.5em;
        flex: 0 0 auto;
        overflow: visible;
        opacity: 0;
        margin-inline: 0.06em;
        animation: v-type 1ms steps(1, end) calc(0.09s + var(--i) * 0.04875s) forwards;
      }
      /* The contraction: the d slides onto the p until the discs overlap at
         the logo's own spacing: centres 1.124 radii apart, so the second disc
         overlaps by 0.657em of a disc rendered 1.5em tall. Both letters are
         complete, so the closing pair IS the mark at every frame — nothing
         is drawn in at the end. */
      #veil .v-d {
        animation:
          v-type 1ms steps(1, end) calc(0.12s + var(--i) * 0.065s) forwards,
          v-join 0.3375s cubic-bezier(0.22, 1, 0.36, 1) 1.375s forwards,
          v-seat 1ms steps(1, end) 1.7125s forwards;
      }
      /* THE HAND-OFF, at the instant the join begins. The p's letter stops
         being drawn inside its own disc and is drawn by the overlay instead —
         same artwork, same box, same offset, so nothing moves; what changes is
         PAINT ORDER, and only from here does it matter. Two steps() on one
         clock: no crossfade to mistime, no frame where both or neither shows. */
      #veil .v-ink {
        animation: v-ink-off 1ms steps(1, end) 1.7125s forwards;
      }
      #veil .v-mark {
        position: absolute;
        left: 0.06em;
        top: 0;
        height: 1.5em;
        width: 1.5em;
        /* base.css clamps every svg to max-width:100%, and this one sits in a
           row that NARROWS under it as the join pulls — clamped, it would
           letterbox and shrink. It keeps its own measure. */
        max-width: none;
        overflow: visible;
        opacity: 0;
        animation: v-ink-in 1ms steps(1, end) 1.7125s forwards;
      }
      @keyframes v-type {
        to { opacity: 1; }
      }
      @keyframes v-gone {
        to { opacity: 0; width: 0; }
      }
      /* Two stages with distinct jobs. v-join CLOSES the 0.12em of margins
         between the coins — at its end the edges are exactly tangent, and it
         is timed to finish with the letters' collapse, so the touch IS the
         collision. v-seat then covers the artwork's remaining 0.6618em of
         overlap (centres 365.58 units apart on discs 654.28 tall: the d's
         left edge stands 0.8382em right of the p's, a pull of 1.5 − 0.8382,
         plus the 0.06em gap the margin held) in ONE steps() frame — the
         discs never render mid-overlap. */
      @keyframes v-join {
        to { margin-left: -0.06em; }
      }
      @keyframes v-seat {
        to { margin-left: -0.7218em; }
      }
      @keyframes v-ink-in {
        to { opacity: 1; }
      }
      @keyframes v-ink-off {
        to { opacity: 0; }
      }
      @keyframes v-tail {
        to { transform: scaleY(1); }
      }
      @keyframes v-fly {
        to {
          left: calc(var(--land-left) + 1.169em);
          top: calc(var(--land-top) + 0.75em);
          font-size: calc(var(--land-h) / 1.5);
        }
      }
      @keyframes v-word-out {
        to { opacity: 0; }
      }
      /* The roll. Phones take it to nothing; desktop stops on the header. */
      @keyframes v-roll {
        to { height: 0; }
      }
      @keyframes v-roll-to-header {
        to { height: 45px; }
      }
      @keyframes veil-done {
        to { visibility: hidden; }
      }
      @media (prefers-reduced-motion: reduce) {
        #veil { display: none; }
      }
    </style>
    <script>
      // Marks the FIRST paint of a hard load, so the page's settle (the
      // staggered arrival behind the parting sheet) plays once and never again
      // on SPA navigation. App.vue clears it when the intro is spent. With JS
      // off the attribute never appears and the page is simply, fully there.
      document.documentElement.dataset.intro = ''
    </script>
    <noscript>
      <style>
        #veil { display: none; }
      </style>
    </noscript>
  </head>

           fine fallback rather than a broken intro. -->

        <span class="v-ch" style="--i:8">o</span>
        <span class="v-ch" style="--i:9">v</span>
