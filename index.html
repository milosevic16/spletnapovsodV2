<!DOCTYPE html>
<html lang="sl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F5F2EB" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Above-the-fold font subsets. Latin only: the kicker, h1 and the lead's
         opening words carry no č/š/ž; the ext subsets swap in behind fontaine's
         metric-matched fallbacks, so the swap changes glyphs, not geometry. -->
    <link rel="preload" href="/fonts/archivo-latin-standard-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/source-serif-4-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <title>SpletnaPovsod</title>
    <!-- Zarez — the opening veil. Static HTML + CSS only, system fonts only,
         no images, no JS dependency: a pure-CSS timed sequence that CANNOT
         hang (the timeline runs whether or not the app ever boots). The first
         thing this brand ever does is cut. Colors mirror tokens.css
         (--list #F5F2EB, --rez #B03B22, --grafit #1A1C1E, --mreza #D9D3C6) —
         keep in sync by hand. %IZRIS% is replaced with the real build date by
         vite.config.ts (a true fact filling the drawing convention honestly). -->
    <style>
      #veil {
        position: fixed;
        inset: 0;
        z-index: 9999;
        pointer-events: none;
        animation: veil-done 0.01s linear 1.8s forwards;
      }
      #veil .v-half {
        position: absolute;
        left: 0;
        right: 0;
        height: 50%;
        background: #f5f2eb;
      }
      #veil .v-top {
        top: 0;
        border-bottom: 1px solid #1a1c1e; /* the cut face, revealed as the sheet parts */
        animation: v-part-up 0.6s cubic-bezier(0.55, 0, 0.55, 0.2) 1.15s forwards;
      }
      #veil .v-bot {
        bottom: 0;
        border-top: 1px solid #1a1c1e;
        animation: v-part-down 0.6s cubic-bezier(0.55, 0, 0.55, 0.2) 1.15s forwards;
      }
      #veil .v-line {
        position: absolute;
        top: calc(50% - 1px);
        left: 0;
        right: 0;
        height: 2px;
        background: #b03b22;
        transform: scaleX(0);
        transform-origin: left center;
        animation: v-cut 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.5s forwards;
      }
      #veil .v-tb {
        position: absolute;
        right: 1.25rem;
        bottom: 1rem;
        margin: 0;
        padding: 0.5rem 0.75rem;
        border: 1px solid #d9d3c6;
        border-right-width: 3px;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 0.68rem;
        letter-spacing: 0.13em;
        color: #1a1c1e;
      }
      @keyframes v-cut {
        to { transform: scaleX(1); }
      }
      @keyframes v-part-up {
        to { transform: translateY(-101%); }
      }
      @keyframes v-part-down {
        to { transform: translateY(101%); }
      }
      @keyframes veil-done {
        to { visibility: hidden; }
      }
      @media (prefers-reduced-motion: reduce) {
        #veil { display: none; }
      }
    </style>
    <noscript>
      <style>
        #veil { display: none; }
      </style>
    </noscript>
  </head>
  <body>
    <div id="veil" aria-hidden="true">
      <div class="v-half v-top"></div>
      <div class="v-half v-bot"><p class="v-tb">SPLETNAPOVSOD&ensp;·&ensp;LIST 1&ensp;·&ensp;MERILO 1 : 1&ensp;·&ensp;IZRIS %IZRIS%</p></div>
      <div class="v-line"></div>
    </div>
    <div id="app"><!--app-html--></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
