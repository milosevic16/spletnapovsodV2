<!DOCTYPE html>
<html lang="sl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- The top of the page is the warm wash — the surface the status bar
         meets. Mirrors --wash; html/body carry it too (base.css). -->
    <meta name="theme-color" content="#F2C4A4" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Above-the-fold font subsets. Latin only: the kicker, h1 and the lead's
         opening words carry no č/š/ž; the ext subsets swap in behind fontaine's
         metric-matched fallbacks, so the swap changes glyphs, not geometry. -->
    <link rel="preload" href="/fonts/archivo-latin-standard-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/source-serif-4-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <title>SpletnaPovsod</title>
    <!-- Zarez — the opening veil. Static HTML + CSS only, system fonts only,
         no images, no JS dependency: a pure-CSS timed sequence that CANNOT
         hang (the timeline runs whether or not the app ever boots). The first
         thing this brand ever does is cut. Colors mirror tokens.css
         (--list #F5F2EB, --rez #B03B22, --grafit #1A1C1E, --mreza #D9D3C6) —
         keep in sync by hand (the veil paints before the bundled CSS loads,
         so no var() here). The IZRIS token is stamped with the real build
         date by scripts/postbuild.mjs, which BLOCKS the build if the token
         survives (a drawing convention filled honestly, never a placeholder). -->
    <style>
      #veil {
        position: fixed;
        inset: 0;
        z-index: 9999;
        pointer-events: none;
        animation: veil-done 0.01s linear 1.8s forwards;
      }
      #veil .v-half {
        position: absolute;
        left: 0;
        right: 0;
        height: 50%;
        background: #f5f2eb;
        overflow: hidden;
      }
      /* The sheet frame — each half carries its part, so the frame parts with
         the cut. Inset mirrors tokens.css --frame. */
      #veil .v-half::before {
        content: '';
        position: absolute;
        left: clamp(0.75rem, 2.2vw, 2rem);
        right: clamp(0.75rem, 2.2vw, 2rem);
        height: 200%;
        border: 1px solid #d9d3c6;
      }
      #veil .v-top::before {
        top: clamp(0.75rem, 2.2vw, 2rem);
      }
      #veil .v-bot::before {
        bottom: clamp(0.75rem, 2.2vw, 2rem);
      }
      /* The wordmark sits ON the cut line: each half carries a copy at the
         same viewport position and clips it, so the name is severed by the
         cut and its two halves leave with the sheet. */
      #veil .v-mark {
        position: absolute;
        left: 0;
        right: 0;
        margin: 0;
        text-align: center;
        white-space: nowrap;
        font-family: Arial, Helvetica, sans-serif;
        font-weight: 700;
        font-size: clamp(1.5rem, 6.2vw, 3.75rem);
        line-height: 1;
        letter-spacing: 0.2em;
        text-indent: 0.2em; /* balances the trailing letter-space */
        color: #1a1c1e;
        opacity: 0;
        animation: v-mark-in 0.45s ease-out 0.12s forwards;
      }
      #veil .v-top .v-mark {
        top: 100%;
        transform: translateY(-50%);
      }
      #veil .v-bot .v-mark {
        top: 0;
        transform: translateY(-50%);
      }
      #veil .v-top {
        top: 0;
        border-bottom: 1px solid #1a1c1e; /* the cut face, revealed as the sheet parts */
        animation: v-part-up 0.62s cubic-bezier(0.7, 0, 0.35, 1) 1.02s forwards;
      }
      #veil .v-bot {
        bottom: 0;
        border-top: 1px solid #1a1c1e;
        animation: v-part-down 0.62s cubic-bezier(0.7, 0, 0.35, 1) 1.02s forwards;
      }
      /* The cut draws from the centre outwards — the knife enters the name. */
      #veil .v-line {
        position: absolute;
        top: calc(50% - 1px);
        left: 0;
        right: 0;
        height: 2px;
        background: #b03b22;
        transform: scaleX(0);
        /* Draws, holds through the parting as the instrument that made the
           cut, then lifts — never blinks off with the veil. */
        animation:
          v-cut 0.62s cubic-bezier(0.22, 1, 0.36, 1) 0.4s forwards,
          v-line-out 0.26s ease-out 1.5s forwards;
      }
      /* Square end ticks — the cut plane's own drawing convention. They ride
         in with the line, then leave with it. */
      #veil .v-line::before,
      #veil .v-line::after {
        content: '';
        position: absolute;
        top: -3px;
        width: 8px;
        height: 8px;
        background: #b03b22;
      }
      #veil .v-line::before {
        left: clamp(0.75rem, 2.2vw, 2rem);
      }
      #veil .v-line::after {
        right: clamp(0.75rem, 2.2vw, 2rem);
      }
      #veil .v-tb {
        position: absolute;
        right: 1.25rem;
        bottom: 1rem;
        margin: 0;
        padding: 0.5rem 0.75rem;
        border: 1px solid #d9d3c6;
        border-right-width: 3px;
        font-family: Arial, Helvetica, sans-serif;
        font-size: clamp(0.52rem, 1.3vw, 0.68rem);
        letter-spacing: 0.12em;
        white-space: nowrap; /* a title block is one ruled line, never two */
        color: #1a1c1e;
      }
      @keyframes v-cut {
        to { transform: scaleX(1); }
      }
      @keyframes v-mark-in {
        to { opacity: 1; }
      }
      @keyframes v-line-out {
        to { opacity: 0; }
      }
      @keyframes v-part-up {
        to { transform: translateY(-101%); }
      }
      @keyframes v-part-down {
        to { transform: translateY(101%); }
      }
      @keyframes veil-done {
        to { visibility: hidden; }
      }
      @media (prefers-reduced-motion: reduce) {
        #veil { display: none; }
      }
    </style>
    <script>
      // Marks the FIRST paint of a hard load, so the page's settle (the
      // staggered arrival behind the parting sheet) plays once and never again
      // on SPA navigation. App.vue clears it when the intro is spent. With JS
      // off the attribute never appears and the page is simply, fully there.
      document.documentElement.dataset.intro = ''
    </script>
    <noscript>
      <style>
        #veil { display: none; }
      </style>
    </noscript>
  </head>
  <body>
    <div id="veil" aria-hidden="true">
      <div class="v-half v-top"><p class="v-mark">SPLETNAPOVSOD</p></div>
      <div class="v-half v-bot">
        <p class="v-mark">SPLETNAPOVSOD</p>
        <p class="v-tb">SPLETNAPOVSOD&ensp;·&ensp;LIST 1&ensp;·&ensp;MERILO 1 : 1&ensp;·&ensp;IZRIS %IZRIS%</p>
      </div>
      <div class="v-line"></div>
    </div>
    <div id="app"><!--app-html--></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
