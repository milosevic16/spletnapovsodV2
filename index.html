<!DOCTYPE html>
<html lang="sl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- The opening band is paper — the surface the status bar meets.
         Mirrors --list; html/body carry it too (base.css). -->
    <meta name="theme-color" content="#F5F2EB" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Above-the-fold font subsets. Latin only: the kicker, h1 and the lead's
         opening words carry no č/š/ž; the ext subsets swap in behind fontaine's
         metric-matched fallbacks, so the swap changes glyphs, not geometry. -->
    <link rel="preload" href="/fonts/archivo-latin-standard-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/source-serif-4-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <title>SpletnaPovsod</title>
    <!-- The opening veil: the logo's origin story. Static HTML + CSS only,
         system fonts only, no images, no JS dependency: a pure-CSS timed
         sequence that CANNOT hang (the timeline runs whether or not the app
         ever boots; the app only removes the spent node — App.vue).

         On black, »spletnapovsod« types out letter by letter; the p of Povsod
         and the final d are set as the LOGO's own halves (red disc, white
         letter) with exaggerated tails. Then the plain letters vanish, the
         word contracts until the two discs overlap into the pd mark, the
         tails retract to logo length, and the mark flies to the hero's own
         brand position while the page renders beneath it and the veil ground
         fades away. The flying mark lands EXACTLY on the real mark and
         crossfades onto it.

         THE LANDING IS A COPIED FORMULA, NOT A MEASUREMENT: left/top/height
         below repeat --hero-inset, --hero-wordmark (tokens.css) and the
         desktop masthead's 45px flow height as literals. StatementSection's
         own comment proves mark-ink-top = inset by construction (its -0.11em
         pull cancels the mark's centring offset). Change any of those and
         these literals change with them — each side names the other.

         TIMELINE (base.css settle delays and App.vue's cleanup are keyed to
         it — change one, change all): type 0.12+i*0.065s (done ~0.9s), hold,
         vanish 1.35s, contract+retract 1.45-1.95s, fly 2.35-2.95s, ground
         fades 2.4-2.85s, mark crossfades out 2.95-3.2s, veil hidden 3.2s,
         node removed 3.8s. -->
    <style>
      #veil {
        position: fixed;
        inset: 0;
        z-index: 9999;
        pointer-events: none;
        background: #0e1013;
        /* The ground lifts while the mark is still flying, then the whole
           veil retires. */
        animation:
          v-bg 0.45s ease-out 2.4s forwards,
          veil-done 0.01s linear 3.2s forwards;
        /* Where the mark lands = the hero brand mark, by shared formula:
           left/top: --hero-inset (+ the desktop masthead's 45px in-flow
           strip); height: 0.78em of --hero-wordmark. Paired with tokens.css
           and StatementSection.vue — change there, change here. */
        --land-left: clamp(1.25rem, 4.9vw, 4.5rem);
        /* + 0.06em of the wordmark font: the phone brand row pads itself by
           (--hero-wordmark-scaley 1.12 − 1) × 0.5em for the text's vertical
           stretch, which pushes the mark down by exactly that (measured:
           2.3px at 375). Desktop scaleY is 1, so its formula carries no term. */
        --land-top: calc(clamp(1.25rem, 4.9vw, 4.5rem) + 0.06 * clamp(1.7rem, -0.6rem + 12.7vw, 5rem));
        --land-h: calc(0.78 * clamp(1.7rem, -0.6rem + 12.7vw, 5rem));
      }
      @media (min-width: 900px) {
        #veil {
          --land-top: calc(45px + clamp(1.25rem, 4.9vw, 4.5rem));
          --land-h: calc(0.78 * clamp(1.6rem, 0.52rem + 5.9vw, 6rem));
        }
      }
      /* The word: one flex row, everything in em so the fly can scale the
         whole assembly by animating font-size alone. Slightly above centre —
         the optical middle of a dark field. */
      #veil .v-word {
        position: absolute;
        left: 50%;
        top: 42%;
        transform: translate(-50%, -50%);
        display: flex;
        align-items: center;
        height: 1.5em;
        margin: 0;
        font-size: clamp(1.05rem, 8.8vw, 2.9rem);
        font-family: Arial, Helvetica, sans-serif;
        font-weight: 600;
        line-height: 1;
        color: #f5f2eb;
        white-space: nowrap;
        /* fly to the brand corner (translate stays; left/top/font-size land
           it): +1.2708em / +0.75em are half the logo's width and height, so
           the untouched -50% translate centres it ON the target box. */
        animation:
          v-fly 0.6s cubic-bezier(0.22, 1, 0.36, 1) 2.35s forwards,
          v-word-out 0.25s ease-out 2.95s forwards;
      }
      /* A typed slot: fixed width so the contraction is animatable. */
      #veil .v-ch {
        display: inline-block;
        width: 0.62em;
        text-align: center;
        opacity: 0;
        overflow: hidden;
        animation:
          v-type 1ms steps(1, end) calc(0.12s + var(--i) * 0.065s) forwards,
          v-gone 0.45s cubic-bezier(0.22, 1, 0.36, 1) 1.35s forwards;
      }
      /* The two logo letters: red disc, white letterform, tails overflowing
         the disc. The d is the p turned 180° — the mark's point symmetry. */
      #veil .v-pd {
        height: 1.5em;
        width: auto;
        flex: 0 0 auto;
        overflow: visible;
        opacity: 0;
        margin-inline: 0.06em;
        animation: v-type 1ms steps(1, end) calc(0.12s + var(--i) * 0.065s) forwards;
      }
      /* The contraction: the d slides onto the p until the discs overlap at
         the logo's own spacing (centres 100/144 of a disc apart, so the
         second disc overlaps by 44/144 = 0.3056 of its 1.5em width). */
      #veil .v-d {
        animation:
          v-type 1ms steps(1, end) calc(0.12s + var(--i) * 0.065s) forwards,
          v-join 0.45s cubic-bezier(0.22, 1, 0.36, 1) 1.5s forwards;
      }
      /* The exaggerated tails retract to logo length (81/115 = 0.7043) as the
         discs meet. transform-box makes the origin each stem's own top IN
         LOCAL COORDS — the d's group is rotated, so the same local animation
         mirrors itself. */
      #veil .v-stem {
        transform-box: fill-box;
        transform-origin: 50% 0;
        animation: v-tail 0.4s cubic-bezier(0.22, 1, 0.36, 1) 1.55s forwards;
      }
      @keyframes v-type {
        to { opacity: 1; }
      }
      @keyframes v-gone {
        to { opacity: 0; width: 0; }
      }
      @keyframes v-join {
        to { margin-left: -0.4584em; }
      }
      @keyframes v-tail {
        to { transform: scaleY(0.7043); }
      }
      @keyframes v-fly {
        to {
          left: calc(var(--land-left) + 1.2708em);
          top: calc(var(--land-top) + 0.75em);
          font-size: calc(var(--land-h) / 1.5);
        }
      }
      @keyframes v-word-out {
        to { opacity: 0; }
      }
      @keyframes v-bg {
        to { background: transparent; }
      }
      @keyframes veil-done {
        to { visibility: hidden; }
      }
      @media (prefers-reduced-motion: reduce) {
        #veil { display: none; }
      }
    </style>
    <script>
      // Marks the FIRST paint of a hard load, so the page's settle (the
      // staggered arrival behind the parting sheet) plays once and never again
      // on SPA navigation. App.vue clears it when the intro is spent. With JS
      // off the attribute never appears and the page is simply, fully there.
      document.documentElement.dataset.intro = ''
    </script>
    <noscript>
      <style>
        #veil { display: none; }
      </style>
    </noscript>
  </head>
  <body>
    <div id="veil" aria-hidden="true">
      <!-- »spletnapovsod«, typed. The p of Povsod and the final d are the
           logo's own halves; the d is the p rotated 180° (the mark's point
           symmetry). Geometry pairs with the BrandMark SVG in
           StatementSection/SiteMasthead — same discs, same letterforms,
           longer tails here (115 vs the logo's 81, retracted by v-tail). -->
      <p class="v-word">
        <span class="v-ch" style="--i:0">s</span>
        <span class="v-ch" style="--i:1">p</span>
        <span class="v-ch" style="--i:2">l</span>
        <span class="v-ch" style="--i:3">e</span>
        <span class="v-ch" style="--i:4">t</span>
        <span class="v-ch" style="--i:5">n</span>
        <span class="v-ch" style="--i:6">a</span>
        <svg class="v-pd v-p" style="--i:7" viewBox="0 0 144 144">
          <circle cx="72" cy="72" r="72" fill="#b03b22" />
          <circle cx="79" cy="79" r="33" fill="none" stroke="#fff" stroke-width="18" />
          <rect class="v-stem" x="37" y="46" width="18" height="115" rx="9" fill="#fff" />
        </svg>
        <span class="v-ch" style="--i:8">o</span>
        <span class="v-ch" style="--i:9">v</span>
        <span class="v-ch" style="--i:10">s</span>
        <span class="v-ch" style="--i:11">o</span>
        <svg class="v-pd v-d" style="--i:12" viewBox="0 0 144 144">
          <g transform="rotate(180 72 72)">
            <circle cx="72" cy="72" r="72" fill="#b03b22" />
            <circle cx="79" cy="79" r="33" fill="none" stroke="#fff" stroke-width="18" />
            <rect class="v-stem" x="37" y="46" width="18" height="115" rx="9" fill="#fff" />
          </g>
        </svg>
      </p>
    </div>
    <div id="app"><!--app-html--></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
